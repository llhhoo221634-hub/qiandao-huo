name: 采集价格

on:
  # 定时采集已关闭：千岛网关对 GitHub runner 的机房 IP 一律回「手速太快」(405)。
  # 采集改由手机端（国内住宅 IP）执行后推送，见 README「数据来源」。
  workflow_dispatch:          # 仅在需要时手动触发验证

permissions:
  contents: read   # 只验证不写回，采集由手机端负责

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        working-directory: collector
        run: npm install --no-audit --no-fund

      - name: 抓一次价（仅验证，不写回仓库）
        working-directory: collector
        env:
          HUO_ROOT: ${{ github.workspace }}/collector
          HUO_CSV: ${{ github.workspace }}/history.csv
        run: node collect.mjs
