name: 采集价格

on:
  # 定时采集已关闭：千岛网关对 GitHub runner 的机房 IP 一律回「手速太快」(405)。
  # 采集改由手机端（国内住宅 IP）执行后推送，见 README「数据来源」。
  workflow_dispatch:          # 仅在需要时手动触发验证

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        working-directory: collector
        run: npm install --no-audit --no-fund

      - name: 抓一次价
        working-directory: collector
        env:
          HUO_ROOT: ${{ github.workspace }}/collector
          HUO_CSV: ${{ github.workspace }}/history.csv
        run: node collect.mjs

      - name: 提交数据
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          rm -rf collector/node_modules
          git add data.json history.csv collector/state || true
          git diff --cached --quiet || git commit -m "chore: price $(date -u +%FT%TZ)"
          git push
